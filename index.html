<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Now - Calvillo</title>
    
    <!-- Fuente Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES Y RESET --- */
        :root {
            --bg-dark: #070814;
            --card-bg: #111322;
            --card-inner: #181b30;
            --card-border: #1d213a;
            --accent-blue: #4f52f5;
            --accent-blue-hover: #3d40d8;
            --text-primary: #ffffff;
            --text-secondary: #8288a8;
            --banner-gradient: linear-gradient(135deg, #2a2e8f 0%, #5027a3 50%, #3632af 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            color: #ff9f43;
        }

        .unit-select {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 13px;
        }

        /* --- SEARCH & HERO --- */
        .hero-section {
            text-align: center;
            margin: 10px 0 10px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .search-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .input-container {
            position: relative;
            flex: 1;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
        }

        .search-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px 12px 40px;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .search-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: var(--accent-blue-hover);
        }

        /* Autocompletado de búsqueda */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-top: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .search-results.active {
            display: block;
        }

        .search-item {
            padding: 12px 16px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .search-item:hover {
            background-color: var(--card-inner);
        }

        /* --- DASHBOARD GRID --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* BANNER PRINCIPAL DE CLIMA */
        .weather-banner {
            background: var(--banner-gradient);
            border-radius: 20px;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-height: 180px;
        }

        /* Decoración de partículas/estrellas */
        .weather-banner::before {
            content: '';
            position: absolute;
            top: 20px;
            right: 180px;
            width: 4px;
            height: 4px;
            background: #ffa500;
            border-radius: 50%;
            box-shadow: 120px 40px 0 #ffa500, -80px 70px 0 #ffffff, 40px -20px 0 #ffffff;
            opacity: 0.7;
        }

        .city-info h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .city-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .banner-temp-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .weather-icon-large {
            width: 54px;
            height: 54px;
        }

        .main-temp {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
        }

        /* TARJETAS DE MÉTRICAS */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        @media (max-width: 600px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-title {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 700;
        }

        /* PRONÓSTICO DIARIO */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        @media (max-width: 650px) {
            .daily-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .daily-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .daily-day {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .daily-icon {
            width: 24px;
            height: 24px;
        }

        .daily-temps {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
        }

        .temp-max {
            color: var(--text-primary);
            font-weight: 600;
        }

        .temp-min {
            color: var(--text-secondary);
        }

        /* --- PANEL DERECHO (HOURLY FORECAST) --- */
        .right-column {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hourly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-dropdown {
            background-color: var(--card-inner);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .hourly-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Scrollbar personalizado */
        .hourly-list::-webkit-scrollbar {
            width: 4px;
        }
        .hourly-list::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }

        .hourly-item {
            background-color: var(--card-inner);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hourly-time {
            font-size: 13px;
            font-weight: 500;
            width: 60px;
        }

        .hourly-icon {
            width: 20px;
            height: 20px;
        }

        .hourly-temp {
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span>Weather Now</span>
            </div>
            <select class="unit-select" id="unitToggle" onchange="toggleUnits()">
                <option value="celsius">Units °C</option>
                <option value="fahrenheit">Units °F</option>
            </select>
        </header>

        <!-- BUSCADOR -->
        <section class="hero-section">
            <h1 class="hero-title">How's the sky looking today?</h1>
            <div class="search-wrapper">
                <div class="input-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search for a place..." autocomplete="off">
                    <div id="searchResults" class="search-results"></div>
                </div>
                <button class="search-btn" onclick="executeSearch()">Search</button>
            </div>
        </section>

        <!-- DASHBOARD -->
        <main class="dashboard-grid">
            <!-- COLUMNA IZQUIERDA -->
            <div class="left-column">
                <!-- TARJETA PRINCIPAL -->
                <div class="weather-banner">
                    <div class="city-info">
                        <h2 id="cityName">Calvillo, Mexico</h2>
                        <p id="currentDate">Cargando...</p>
                    </div>
                    <div class="banner-temp-container">
                        <div id="mainWeatherIcon"></div>
                        <div class="main-temp"><span id="mainTemp">--</span>°</div>
                    </div>
                </div>

                <!-- MÉTRICAS CLAVE -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-title">Feels Like</span>
                        <span class="metric-value"><span id="feelsLike">--</span>°</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">Humidity</span>
                        <span class="metric-value"><span id="humidity">--</span>%</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">Wind</span>
                        <span class="metric-value"><span id="wind">--</span> <span id="windUnit">km/h</span></span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">Precipitation</span>
                        <span class="metric-value"><span id="precipitation">--</span> mm</span>
                    </div>
                </div>

                <!-- PRONÓSTICO 7 DÍAS -->
                <div>
                    <h3 class="section-title">Daily forecast</h3>
                    <div class="daily-grid" id="dailyContainer">
                        <!-- Generado por JS -->
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA (POR HORA) -->
            <div class="right-column">
                <div class="hourly-header">
                    <h3 class="section-title" style="margin: 0;">Hourly forecast</h3>
                    <select class="day-dropdown" id="hourlyDaySelect" onchange="renderHourlyForecast()">
                        <!-- Generado por JS -->
                    </select>
                </div>
                <div class="hourly-list" id="hourlyContainer">
                    <!-- Generado por JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT JS -->
    <script>
        // --- CONFIGURACIÓN E INICIALIZACIÓN ---
        // Coordenadas por defecto para Calvillo, Aguascalientes, México
        let currentCity = {
            name: "Calvillo, Mexico",
            lat: 21.8469,
            lon: -102.7188
        };

        let weatherData = null;
        let isFahrenheit = false;

        // Íconos SVG para diferentes códigos del clima WMO
        function getWeatherIcon(code) {
            // Sol despejado
            if (code === 0) {
                return `<svg class="weather-icon-large" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#FFC107"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/></svg>`;
            }
            // Parcialmente nublado
            if (code >= 1 && code <= 3) {
                return `<svg class="weather-icon-large" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="4" fill="#FFC107"/><path d="M17 18a4 4 0 00-3.8-5.3 5 5 0 00-9.5 2.3A3.5 3.5 0 005 22h12a4 4 0 000-8z" fill="#90A4AE"/></svg>`;
            }
            // Lluvia / Llovizna
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                return `<svg class="weather-icon-large" viewBox="0 0 24 24" fill="none"><path d="M17 14a4 4 0 00-3.8-5.3 5 5 0 00-9.5 2.3A3.5 3.5 0 005 18h12a4 4 0 000-8z" fill="#78909C"/><path d="M8 19v3m4-3v3m4-3v3" stroke="#29B6F6" stroke-width="2" stroke-linecap="round"/></svg>`;
            }
            // Tormenta
            if (code >= 95) {
                return `<svg class="weather-icon-large" viewBox="0 0 24 24" fill="none"><path d="M17 12a4 4 0 00-3.8-5.3 5 5 0 00-9.5 2.3A3.5 3.5 0 005 16h12a4 4 0 000-8z" fill="#546E7A"/><path d="M13 15l-3 5h3l-1 4" stroke="#FFD54F" stroke-width="2" stroke-linejoin="round"/></svg>`;
            }
            // Nube / Por defecto
            return `<svg class="weather-icon-large" viewBox="0 0 24 24" fill="none"><path d="M17 15a4 4 0 00-3.8-5.3 5 5 0 00-9.5 2.3A3.5 3.5 0 005 19h12a4 4 0 000-8z" fill="#B0BEC5"/></svg>`;
        }

        // --- CARGA DE DATOS DESDE LA API ---
        async function fetchWeatherData(lat, lon, name) {
            try {
                // API gratuita Open-Meteo
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                
                const response = await fetch(url);
                weatherData = await response.json();
                
                if (name) currentCity.name = name;
                currentCity.lat = lat;
                currentCity.lon = lon;

                updateUI();
            } catch (error) {
                console.error("Error al obtener los datos del clima:", error);
                alert("No se pudieron cargar los datos del clima. Intenta nuevamente.");
            }
        }

        // --- ACTUALIZACIÓN DE LA INTERFAZ ---
        function updateUI() {
            if (!weatherData) return;

            // 1. Información principal
            document.getElementById('cityName').textContent = currentCity.name;
            
            const now = new Date();
            const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);

            const curr = weatherData.current;
            
            // Temperaturas
            const mainTemp = convertTemp(curr.temperature_2m);
            const feelsLike = convertTemp(curr.apparent_temperature);
            
            document.getElementById('mainTemp').textContent = mainTemp;
            document.getElementById('feelsLike').textContent = feelsLike;
            document.getElementById('humidity').textContent = curr.relative_humidity_2m;
            document.getElementById('precipitation').textContent = curr.precipitation;
            
            // Viento (Convertir si se elige Fahrenheit/mph)
            const windSpeed = isFahrenheit ? Math.round(curr.wind_speed_10m * 0.621371) : Math.round(curr.wind_speed_10m);
            document.getElementById('wind').textContent = windSpeed;
            document.getElementById('windUnit').textContent = isFahrenheit ? 'mph' : 'km/h';

            // Ícono principal
            document.getElementById('mainWeatherIcon').innerHTML = getWeatherIcon(curr.weather_code);

            // 2. Renderizar Pronóstico Diario
            renderDailyForecast();

            // 3. Renderizar Menú de Días e Horas
            setupHourlyDropdown();
            renderHourlyForecast();
        }

        // Convertir Temperatura según la unidad seleccionada
        function convertTemp(tempC) {
            if (isFahrenheit) {
                return Math.round((tempC * 9/5) + 32);
            }
            return Math.round(tempC);
        }

        function toggleUnits() {
            const select = document.getElementById('unitToggle');
            isFahrenheit = select.value === 'fahrenheit';
            updateUI();
        }

        // --- PRONÓSTICO DIARIO ---
        function renderDailyForecast() {
            const container = document.getElementById('dailyContainer');
            container.innerHTML = '';

            const daily = weatherData.daily;
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            for (let i = 0; i < 7; i++) {
                const date = new Date(daily.time[i] + 'T00:00:00');
                const dayName = days[date.getDay()];
                const maxTemp = convertTemp(daily.temperature_2m_max[i]);
                const minTemp = convertTemp(daily.temperature_2m_min[i]);
                const code = daily.weather_code[i];

                const card = document.createElement('div');
                card.className = 'daily-card';
                card.innerHTML = `
                    <span class="daily-day">${dayName}</span>
                    <div style="transform: scale(0.8);">${getWeatherIcon(code)}</div>
                    <div class="daily-temps">
                        <span class="temp-max">${maxTemp}°</span>
                        <span class="temp-min">${minTemp}°</span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // --- PRONÓSTICO POR HORA ---
        function setupHourlyDropdown() {
            const select = document.getElementById('hourlyDaySelect');
            select.innerHTML = '';

            const daily = weatherData.daily;
            const daysName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            for (let i = 0; i < 7; i++) {
                const date = new Date(daily.time[i] + 'T00:00:00');
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i === 0 ? 'Today' : daysName[date.getDay()];
                select.appendChild(option);
            }
        }

        function renderHourlyForecast() {
            const container = document.getElementById('hourlyContainer');
            container.innerHTML = '';

            const dayIndex = parseInt(document.getElementById('hourlyDaySelect').value) || 0;
            const hourly = weatherData.hourly;

            // Cada día tiene 24 horas (offset = dayIndex * 24)
            const startIndex = dayIndex * 24;
            const endIndex = startIndex + 24;

            for (let i = startIndex; i < endIndex; i += 2) { // Muestra de 2 en 2 horas para vista limpia
                const timeStr = hourly.time[i];
                const date = new Date(timeStr);
                
                let hours = date.getHours();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // Formato 12 hrs
                const formattedTime = `${hours} ${ampm}`;

                const temp = convertTemp(hourly.temperature_2m[i]);
                const code = hourly.weather_code[i];

                const item = document.createElement('div');
                item.className = 'hourly-item';
                item.innerHTML = `
                    <span class="hourly-time">${formattedTime}</span>
                    <div style="transform: scale(0.65); display: flex; align-items: center;">${getWeatherIcon(code)}</div>
                    <span class="hourly-temp">${temp}°</span>
                `;
                container.appendChild(item);
            }
        }

        // --- SISTEMA DE BÚSQUEDA ---
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        // Búsqueda en tiempo real al escribir
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }

            debounceTimer = setTimeout(() => {
                fetchLocationSuggestions(query);
            }, 300);
        });

        async function fetchLocationSuggestions(query) {
            try {
                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=es&format=json`;
                const res = await fetch(url);
                const data = await res.json();

                searchResults.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    searchResults.classList.add('active');
                    data.results.forEach(loc => {
                        const item = document.createElement('div');
                        item.className = 'search-item';
                        const country = loc.country ? `, ${loc.country}` : '';
                        const admin = loc.admin1 ? `, ${loc.admin1}` : '';
                        const displayName = `${loc.name}${admin}${country}`;
                        
                        item.textContent = displayName;
                        item.onclick = () => {
                            searchInput.value = displayName;
                            searchResults.classList.remove('active');
                            fetchWeatherData(loc.latitude, loc.longitude, displayName);
                        };
                        searchResults.appendChild(item);
                    });
                } else {
                    searchResults.classList.remove('active');
                }
            } catch (err) {
                console.error("Error buscando ubicación:", err);
            }
        }

        // Botón de búsqueda directa
        function executeSearch() {
            const query = searchInput.value.trim();
            if (query.length > 0) {
                fetchLocationSuggestions(query);
            }
        }

        // Cerrar lista al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                searchResults.classList.remove('active');
            }
        });

        // Permitir presionar Enter para buscar
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });

        // --- AL CARGAR LA PÁGINA ---
        window.onload = () => {
            // Carga inicial por defecto: Calvillo, México
            fetchWeatherData(currentCity.lat, currentCity.lon, currentCity.name);
        };
    </script>
</body>
</html>
